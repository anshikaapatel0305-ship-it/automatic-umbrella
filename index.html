<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Gamified Study Planner</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

.dark {
  background: #1e1e1e;
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
}

section {
  margin: 20px 0;
  padding: 15px;
  background: white;
  border-radius: 10px;
}

.dark section {
  background: #2c2c2c;
}

button {
  margin-top: 10px;
  padding: 8px;
  cursor: pointer;
}

input {
  margin: 5px;
  padding: 5px;
}

/* Mobile */
@media(max-width:600px){
  body { font-size: 14px; }
}
</style>

</head>
<body>

<header>
  <h1>🎮 AI Smart Study Planner</h1>
  <button onclick="toggleDarkMode()">🌙</button>
</header>

<!-- AI Planner -->
<section>
  <h2>🤖 AI Timetable Generator</h2>
  <input id="subject" placeholder="Subject">
  <input id="difficulty" placeholder="Difficulty (easy/medium/hard)">
  <input id="hours" type="number" placeholder="Daily Free Hours">
  <button onclick="generatePlan()">Generate Plan</button>
  <ul id="timetable"></ul>
</section>

<!-- Tasks -->
<section>
  <h2>📅 Tasks</h2>
  <input id="taskInput" placeholder="New Task">
  <button onclick="addTask()">Add Task</button>
  <ul id="taskList"></ul>
</section>

<!-- Dashboard -->
<section>
  <h2>📊 Dashboard</h2>
  <p>XP: <span id="xp">0</span></p>
  <p>🔥 Streak: <span id="streak">0</span></p>
  <canvas id="chart"></canvas>
</section>

<button onclick="downloadPDF()">🧾 Download Timetable</button>

<script>
let xp = 0;
let streak = 0;
let studyData = [];

// 🌙 Dark Mode
function toggleDarkMode(){
  document.body.classList.toggle("dark");
}

// 🤖 AI Logic
function generatePlan(){
  let subject = document.getElementById("subject").value;
  let difficulty = document.getElementById("difficulty").value.toLowerCase();
  let hours = parseFloat(document.getElementById("hours").value);

  if(!subject || !difficulty || !hours){
    alert("Fill all fields");
    return;
  }

  let time = hours;

  if(difficulty === "hard") time *= 1.5;
  if(difficulty === "easy") time *= 0.7;

  let suggestion = (difficulty === "hard") 
    ? "Morning Study Recommended" 
    : "Evening Revision Recommended";

  let plan = `${subject} - ${time.toFixed(1)} hrs (${suggestion})`;

  let li = document.createElement("li");
  li.textContent = plan;
  document.getElementById("timetable").appendChild(li);

  studyData.push(time);
  updateChart();
}

// 📅 Task System
function addTask(){
  let input = document.getElementById("taskInput");
  let task = input.value;

  if(!task) return;

  let li = document.createElement("li");
  li.textContent = task;

  li.onclick = function(){
    li.style.textDecoration = "line-through";
    gainXP();
  };

  document.getElementById("taskList").appendChild(li);
  input.value = "";
}

// 🎮 XP + Streak
function gainXP(){
  xp += 10;
  streak += 1;

  document.getElementById("xp").textContent = xp;
  document.getElementById("streak").textContent = streak;
}

// 📊 Chart
let ctx = document.getElementById('chart').getContext('2d');
let chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: [],
    datasets: [{
      label: 'Study Hours',
      data: []
    }]
  }
});

function updateChart(){
  chart.data.labels.push("Session " + (chart.data.labels.length+1));
  chart.data.datasets[0].data = studyData;
  chart.update();
}

// 🧾 PDF Download
function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Study Timetable", 10, 10);

  let items = document.querySelectorAll("#timetable li");
  let y = 20;

  items.forEach(item => {
    doc.text(item.textContent, 10, y);
    y += 10;
  });

  doc.save("timetable.pdf");
}
</script>

</body>
</html>
